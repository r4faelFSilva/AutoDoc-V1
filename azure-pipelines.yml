trigger: none  # evita disparo automático; use manual na demo

pool:
  name: Default  # pool com agente self-hosted

variables:
  - group: autodoc-local

steps:
  - task: PowerShell@2
    displayName: Health check API local
    inputs:
      targetType: inline
      script: |
        $r = Invoke-RestMethod -Uri "$(AUTODOC_API_URL)/health" -Method Get
        if ($r.status -ne "ok") { throw "API nao respondeu ok" }
        Write-Host "API OK"

  - task: PowerShell@2
    displayName: Login AutoDoc
    inputs:
      targetType: inline
      script: |
        $body = @{ email = "$(AUTODOC_EMAIL)"; password = "$(AUTODOC_PASSWORD)" } | ConvertTo-Json -Compress
        $login = Invoke-RestMethod -Uri "$(AUTODOC_API_URL)/api/auth/login" `
          -Method Post -ContentType "application/json; charset=utf-8" -Body $body
        Write-Host "##vso[task.setvariable variable=AUTODOC_TOKEN;issecret=true]$($login.access_token)"

  - task: PowerShell@2
    displayName: Avaliar se documentacao precisa ser atualizada
    env:
      AUTODOC_GITHUB_TOKEN: $(AUTODOC_GITHUB_TOKEN)
    inputs:
      targetType: inline
      script: |
        function Invoke-AutoDocJsonPost {
          param(
            [string]$Uri,
            [hashtable]$Headers,
            [hashtable]$Payload
          )
          $json = ($Payload | ConvertTo-Json -Compress -Depth 5)
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $response = Invoke-WebRequest -Uri $Uri -Method Post `
            -Headers $Headers -ContentType "application/json; charset=utf-8" -Body $bytes -UseBasicParsing
          return ($response.Content | ConvertFrom-Json)
        }

        $headers = @{
          Authorization = "Bearer $(AUTODOC_TOKEN)"
          "X-GitHub-Token" = $env:AUTODOC_GITHUB_TOKEN
        }
        $targetPath = "$(AUTODOC_COMMIT_PATH)"
        if ([string]::IsNullOrWhiteSpace($targetPath)) { $targetPath = "README.md" }
        $payload = @{
          github_url  = "$(AUTODOC_GITHUB_URL)"
          target_path = $targetPath
        }
        $branch = "$(AUTODOC_BRANCH)"
        if (-not [string]::IsNullOrWhiteSpace($branch)) { $payload.branch = $branch }

        $eval = Invoke-AutoDocJsonPost -Uri "$(AUTODOC_API_URL)/api/generate/github/evaluate" `
          -Headers $headers -Payload $payload
        Write-Host "Commit analisado: $($eval.latest_commit_sha) — $($eval.latest_commit_message)"
        Write-Host "Arquivos alterados: $($eval.changed_files_count) | Doc existe: $($eval.doc_exists)"
        Write-Host "Decisao: needs_update=$($eval.needs_update) | confidence=$($eval.confidence)"
        Write-Host "Motivo: $($eval.reason)"
        $flag = if ($eval.needs_update) { "true" } else { "false" }
        Write-Host "##vso[task.setvariable variable=NEEDS_UPDATE]$flag"

  - task: PowerShell@2
    displayName: Gerar documentacao via GitHub
    condition: eq(variables['NEEDS_UPDATE'], 'true')
    inputs:
      targetType: inline
      script: |
        $headers = @{ Authorization = "Bearer $(AUTODOC_TOKEN)" }
        $payload = @{
          github_url  = "$(AUTODOC_GITHUB_URL)"
          template_id = "$(AUTODOC_TEMPLATE_ID)"
          output_type = "technical"
        }
        $branch = "$(AUTODOC_BRANCH)"
        if (-not [string]::IsNullOrWhiteSpace($branch)) { $payload.branch = $branch }
        $json = ($payload | ConvertTo-Json -Compress -Depth 5)
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
        $response = Invoke-WebRequest -Uri "$(AUTODOC_API_URL)/api/generate/github" -Method Post `
          -Headers $headers -ContentType "application/json; charset=utf-8" -Body $bytes -UseBasicParsing
        $doc = ($response.Content | ConvertFrom-Json)
        if ($doc.status -ne "completed") { throw "Geracao falhou: status=$($doc.status)" }
        Write-Host "Documento gerado: id=$($doc.id)"
        New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)" | Out-Null
        $outFile = Join-Path "$(Build.ArtifactStagingDirectory)" "doc-gerada.md"
        [System.IO.File]::WriteAllText($outFile, $doc.content, [System.Text.UTF8Encoding]::new($false))
        Write-Host "##vso[task.setvariable variable=DOC_ID;isOutput=false]$($doc.id)"

  - task: PowerShell@2
    displayName: Commit documentacao no GitHub
    condition: eq(variables['NEEDS_UPDATE'], 'true')
    env:
      AUTODOC_GITHUB_TOKEN: $(AUTODOC_GITHUB_TOKEN)
    inputs:
      targetType: inline
      script: |
        $docId = "$(DOC_ID)".Trim()
        if ([string]::IsNullOrWhiteSpace($docId)) {
          throw "DOC_ID vazio. A geracao anterior nao definiu o id do documento."
        }
        Write-Host "Publicando documento id=$docId (conteudo vem do SQLite, mesmo fluxo da tela)"

        $headers = @{
          Authorization = "Bearer $(AUTODOC_TOKEN)"
          "X-GitHub-Token" = $env:AUTODOC_GITHUB_TOKEN
        }
        $targetPath = "$(AUTODOC_COMMIT_PATH)"
        if ([string]::IsNullOrWhiteSpace($targetPath)) { $targetPath = "README.md" }
        $commitMsg = "$(AUTODOC_COMMIT_MESSAGE)"
        if ([string]::IsNullOrWhiteSpace($commitMsg)) {
          $commitMsg = "docs: atualiza documentacao via AutoDoc CI"
        }
        $payload = [ordered]@{
          github_url     = "$(AUTODOC_GITHUB_URL)"
          doc_id         = $docId
          target_path    = $targetPath
          commit_message = $commitMsg
        }
        $branch = "$(AUTODOC_BRANCH)"
        if (-not [string]::IsNullOrWhiteSpace($branch)) { $payload.branch = $branch }

        $json = ($payload | ConvertTo-Json -Compress -Depth 5)
        Write-Host "Payload JSON ($($json.Length) bytes, sem token no body)"
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)

        try {
          $response = Invoke-WebRequest -Uri "$(AUTODOC_API_URL)/api/generate/github/commit" -Method Post `
            -Headers $headers -ContentType "application/json; charset=utf-8" -Body $bytes -UseBasicParsing
          $commit = ($response.Content | ConvertFrom-Json)
          Write-Host "Commit publicado: $($commit.commit_url)"
          Write-Host "Arquivo: $($commit.target_path) | Branch: $($commit.branch)"
        } catch {
          $detail = $_.ErrorDetails.Message
          if (-not $detail -and $_.Exception.Response) {
            $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
            $detail = $reader.ReadToEnd()
          }
          Write-Host "Resposta de erro: $detail"
          if ($detail -match "identico ao arquivo remoto") {
            Write-Host "Commit ignorado: conteudo identico ao remoto."
          } elseif ($detail -match "doc_id|Informe content ou doc_id") {
            throw "Backend desatualizado ou doc_id invalido. Reinicie run_dev.ps1 e confirme que o codigo com suporte a doc_id esta rodando. Detalhe: $detail"
          } else {
            throw
          }
        }

  - task: PowerShell@2
    displayName: Documentacao ja esta atualizada
    condition: ne(variables['NEEDS_UPDATE'], 'true')
    inputs:
      targetType: inline
      script: |
        Write-Host "Nenhuma geracao ou commit necessario nesta execucao."

  - task: PublishBuildArtifacts@1
    displayName: Publicar Markdown gerado
    condition: eq(variables['NEEDS_UPDATE'], 'true')
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: autodoc-output
